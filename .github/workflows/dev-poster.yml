name: DEV poster (one article a day on dev.to)

# 23 Nov 2026. Publishes ONE original article a day to DEV (dev.to, @inayaflow) through the official Forem API (POST /api/articles).
# Writer: Claude Sonnet 5.5 + web search. QA: Haiku + offline checks. HARD cap $0.60 a UTC day over ALL runs (writer + QA + retry; the poster checks the
# cost before each model call and keeps the day's spend in its state); at most 2 dry runs a day; one article a day (DEV is asked what we published today).
# Any FAIL = nothing is published, the draft is saved to the PRIVATE repo (imran0786/genie, branch ops-dev-poster) for the Director.
# SWITCH: NOTHING is published (scheduled OR manual run, dry_run input or not) unless the repository variable DEV_POSTER_LIVE is "true"; the poster
# checks the switch itself as well. Manual runs default to dry_run=true. No run at all unless the private state was restored (fail closed).
# Public log = page slug, status words, cost only (never the key, never article text).
on:
  schedule:
    - cron: "23 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = write and check the article, publish nothing"
        default: "true"

permissions:
  contents: read

concurrency:
  group: dev-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45          # worst writer path = 6 calls x 240 s = 24 min + QA + fetches; the save step below needs time after it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (a failure stops the run)
        run: python3 -W ignore scripts/dev_poster/test_poster.py

      - name: Restore state from the private repo
        env:
          GENIE_LOGS_TOKEN: ${{ secrets.GENIE_LOGS_TOKEN }}
        run: |
          echo "::add-mask::$GENIE_LOGS_TOKEN"
          mkdir -p ops
          U="https://x-access-token:${GENIE_LOGS_TOKEN}@github.com/imran0786/genie.git"
          if git ls-remote --exit-code --heads "$U" ops-dev-poster >/dev/null 2>&1; then rc=0; else rc=$?; fi
          if [ "$rc" = "0" ]; then
            if git clone -q --branch ops-dev-poster --depth 1 "$U" /tmp/logs 2>/dev/null \
               && python3 -c "import json,sys; d=json.load(open('/tmp/logs/ops/dev_poster_state.json')); sys.exit(0 if isinstance(d, dict) and isinstance(d.get('posts', []), list) else 1)" 2>/dev/null; then
              cp /tmp/logs/ops/dev_poster_state.json ops/
              cp /tmp/logs/ops/dev_poster_log.md ops/ 2>/dev/null || true
              echo "DEV_STATE_OK=true" >> "$GITHUB_ENV"
              echo "state restored"
            else
              echo "state branch exists but the state file is missing or unreadable: no run"
            fi
          elif [ "$rc" = "2" ]; then
            echo "DEV_STATE_OK=true" >> "$GITHUB_ENV"
            echo "DEV_FIRST_RUN=true" >> "$GITHUB_ENV"
            echo "no state branch yet (first run)"
          else
            echo "private repo unreachable: no run"
          fi

      - name: Write, check and (when live) publish
        timeout-minutes: 35        # shorter than the job: the save step always has time to run, even after a timeout
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEV_API_KEY: ${{ secrets.DEV_API_KEY }}
          DEV_POSTER_LIVE: ${{ vars.DEV_POSTER_LIVE }}
          DRY_RUN: ${{ vars.DEV_POSTER_LIVE == 'true' && ((github.event_name == 'schedule' && 'false') || github.event.inputs.dry_run || 'true') || 'true' }}
          DEV_DAY_USD_CAP: "0.60"
        run: |
          echo "::add-mask::$DEV_API_KEY"
          python3 scripts/dev_poster/poster.py 2>/dev/null

      - name: Save state, log and drafts to the private repo (never here)
        if: always()
        env:
          GENIE_LOGS_TOKEN: ${{ secrets.GENIE_LOGS_TOKEN }}
        run: |
          echo "::add-mask::$GENIE_LOGS_TOKEN"
          set -e
          rm -rf /tmp/push
          U="https://x-access-token:${GENIE_LOGS_TOKEN}@github.com/imran0786/genie.git"
          if git ls-remote --exit-code --heads "$U" ops-dev-poster >/dev/null 2>&1; then rc=0; else rc=$?; fi
          if [ "$rc" = "0" ]; then
            # the state branch EXISTS: it must be cloned, never re-created. If that fails, stop cleanly: no orphan branch, nothing pushed.
            if ! git clone -q --branch ops-dev-poster --depth 1 "$U" /tmp/push 2>/dev/null; then
              echo "state branch exists but cannot be cloned: NOT saving (no orphan branch is created); the state stays in this run's ops/ folder only"
              exit 1
            fi
          elif [ "$rc" = "2" ]; then
            git clone -q --depth 1 "$U" /tmp/push
            cd /tmp/push && git checkout -q --orphan ops-dev-poster && git rm -rq --cached . >/dev/null 2>&1 || true
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} + ; cd - >/dev/null
          else
            echo "private repo unreachable: NOT saving"
            exit 1
          fi
          mkdir -p /tmp/push/ops
          for f in dev_poster_state.json dev_poster_log.md; do
            [ -f "ops/$f" ] && cp "ops/$f" "/tmp/push/ops/$f" || true
          done
          [ -d ops/dev_drafts ] && mkdir -p /tmp/push/ops/dev_drafts && cp ops/dev_drafts/* /tmp/push/ops/dev_drafts/ || true
          cd /tmp/push
          git config user.name "inayaflow-bot"
          git config user.email "contact@inayaflow.ai"
          git add ops
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "ops: dev poster state and log"
          ok=0
          for i in 1 2 3 4; do
            if git push -q origin ops-dev-poster; then ok=1; break; fi
            git pull -q --rebase origin ops-dev-poster || git rebase --abort || true
            sleep 3
          done
          [ "$ok" = "1" ] || { echo "push failed after 4 tries: the day's spend was NOT saved"; exit 1; }
          echo "state saved"
