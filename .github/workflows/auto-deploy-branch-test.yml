name: TEMPORARY deploy robot branch test (removed before code QA round 2)

# One-off dry run of the feat/auto-deploy branch on 21 Nov 2026. It gets NO Anthropic key (a branch run never reviews)
# and only the token the other robots already use, to read the app repo and write the private log. Nothing is deployed:
# DEPLOY_DRY is true and the code refuses LIVE away from main.
on:
  push:
    branches: ["feat/auto-deploy"]

permissions:
  contents: read

concurrency:
  group: auto-deploy
  cancel-in-progress: false

jobs:
  dry:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: |
          python3 -W ignore scripts/deploy_robot/test_policy.py
          python3 -W ignore scripts/deploy_robot/test_robot.py
          npm install --prefix /tmp/tsdep --no-audit --no-fund --ignore-scripts typescript@5.9.3
          NODE_PATH=/tmp/tsdep/node_modules REQUIRE_TS=1 python3 -W ignore scripts/deploy_robot/test_ts_check.py
      - name: Dry run (no review, nothing pushed to the app)
        env:
          GENIE_LOGS_TOKEN: ${{ secrets.GENIE_LOGS_TOKEN }}
          DEPLOY_DRY: "true"
        run: |
          echo "::add-mask::$GENIE_LOGS_TOKEN"
          python3 scripts/deploy_robot/robot.py 2>/dev/null
