name: List builder (new candidate places a day)

# 24 Nov 2026. Imran: "We should have at least 2,000, 3,000, going up to 5,000 list of platforms, directories, tools, guides, blog forms, anything,
# everything ... I want to know how much list has increased today."
# Twice a day (04:23 and 16:23 UTC): Claude Sonnet + web search lists ~450 NEW places over 12 rotating categories; code dedupes by registrable domain against every list
# we hold, opens each URL (GET only, HTTP 200-399), drops spam, marks paid-only as HOLD paid, and adds the rest to data/directories_candidates.json
# (status TODO for directory-type places, TODO outreach for outreach-type places). The day's summary line "list-builder: +N new (total T; by category ...)"
# is in data/list_builder_state.json (now "list-builder: sonnet +N new (F followed, $x) | deepseek +M new ..."; the twin is list-builder-deepseek.yml, same code,
# separate $1 cap, shares this concurrency group). Writes ONLY its own files: data/directories_candidates.json, data/list_builder_state.json, data/needs_signup_sonnet.md, data/list_builder_report_sonnet.md (plus the shared side-by-side data/list_builder_compare.md); the DeepSeek twin has its own *_deepseek files and both read both candidates files for dedupe. Signs up nowhere, sends nothing, fills no form.
# SPEND: hard cap $3.00 a UTC day over all runs (LIST_BUILDER_DAY_USD_CAP; 24 Nov: Imran "raise it to $3 a day", +$2). $16.98 a day is the hard cap of the LISTED robots together
# (directory agent 7.10, hunter 3.00, list builder 3.00, platform poster 0.90, batch 1.00, report 0.48, replier 0.45, router 0.45, DEV poster 0.60 = 16.98; see README).
# Scheduled runs are live; a manual run defaults to dry_run=true (candidates are not written, the spend is still booked).
on:
  schedule:
    - cron: "23 4 * * *"
    - cron: "23 16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = look and check, write no candidates"
        default: "true"

permissions:
  contents: write

concurrency:
  group: list-builder
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (a failure stops the run)
        run: python3 -W ignore scripts/list_builder/test_builder.py
      - name: Build the list
        timeout-minutes: 30
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || (github.event_name == 'schedule' && 'false') || 'true' }}
          LIST_BUILDER_DAY_USD_CAP: "3.00"   # 24 Nov late: 1.00 -> 3.00 (Imran approved +$2/day; listed robots 14.98 -> 16.98). History: 3.00 -> 1.00 earlier 24 Nov when $2 moved to the directory agent
        run: |
          echo "::add-mask::$ANTHROPIC_API_KEY"
          python3 scripts/list_builder/builder.py 2>/dev/null
      - name: Save candidates and state (this repo, data files only)
        if: always()
        run: |
          git config user.name "inayaflow-bot"
          git config user.email "contact@inayaflow.ai"
          for f in data/directories_candidates.json data/list_builder_state.json data/needs_signup_sonnet.md data/list_builder_report_sonnet.md data/list_builder_compare.md; do if [ -f "$f" ]; then git add "$f"; fi; done
          for f in data/directories_candidates.json data/list_builder_state.json; do if [ -f "$f" ] && ! python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf8'))" "$f"; then echo "data file unreadable, nothing saved"; exit 1; fi; done
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "data: list builder (sonnet, new candidate places, state)"
          for i in 1 2 3; do
            if git push -q origin HEAD:main; then echo "saved"; exit 0; fi
            # conflict (the backlink batch also writes the candidates files): keep our rows AND theirs (union by domain); this provider's own state is merged, never copied over
            git show HEAD:data/directories_candidates.json > /tmp/ours.json
            git show HEAD:data/list_builder_state.json > /tmp/ours_state.json
            git fetch -q origin main
            git reset -q --hard origin/main
            if [ -f data/directories_candidates.json ]; then python3 scripts/reports/merge_candidates.py /tmp/ours.json data/directories_candidates.json; else cp /tmp/ours.json data/directories_candidates.json; fi
            if [ -f data/list_builder_state.json ]; then python3 scripts/list_builder/merge_state.py /tmp/ours_state.json data/list_builder_state.json; else cp /tmp/ours_state.json data/list_builder_state.json; fi
            for f in data/directories_candidates.json data/list_builder_state.json data/needs_signup_sonnet.md data/list_builder_report_sonnet.md data/list_builder_compare.md; do if [ -f "$f" ]; then git add "$f"; fi; done
            git diff --cached --quiet && { echo "nothing left to save"; exit 0; }
            git commit -q -m "data: list builder (sonnet, merged)"
          done
          echo "push failed"; exit 1
