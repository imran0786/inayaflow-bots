name: Job runner (helper jobs on the Claude API)

# Runs the Director's helper jobs on Claude Haiku (API credit) instead of Claude Code sessions.
# Briefs and results live ONLY in the PRIVATE repo imran0786/genie, branch ops-jobs (jobs/pending -> jobs/done).
# The agent can read project files, search and fetch the web, and write ONE result. It cannot send mail, post,
# merge, deploy, pay or sign in. Caps: $0.20 per job by default (hard ceiling $1), $3 a day, 3 jobs per run.
# Public output: job counts, status codes and cost only.
# DeepSeek backup: switched OFF. To switch on later: add the secret DEEPSEEK_API_KEY and set JOB_DEEPSEEK_FALLBACK to "true".
on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: job-runner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -W ignore scripts/job_runner/test_runner.py 2>&1 | tail -3
      - name: Run pending jobs (private repo, never here)
        env:
          GENIE_LOGS_TOKEN: ${{ secrets.GENIE_LOGS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          JOB_DEEPSEEK_FALLBACK: "false"
          DAILY_COST_CAP: "3.00"
          DEFAULT_JOB_COST_CAP: "0.20"
          MAX_JOBS_PER_RUN: "3"
        run: |
          echo "::add-mask::$GENIE_LOGS_TOKEN"
          python3 scripts/job_runner/runner.py 2>/dev/null
