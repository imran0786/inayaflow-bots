name: Job runner (helper jobs on the Claude API)

# Runs the Director's helper jobs on the Claude API instead of Claude Code sessions.
# Briefs and results live ONLY in the PRIVATE repo imran0786/genie, branch ops-jobs (jobs/pending -> jobs/done).
# Normal jobs (Haiku): the agent can read project files, search and fetch the web, and write ONE result.
# Code jobs (Sonnet): the agent edits a fresh copy of the app, the runner runs npm test in a container (no secrets,
# no network) and pushes ONE NEW branch robot/<name>. Never main, never a merge, never SQL, never deploy settings.
# No job can send mail, post, pay or sign in. Caps: $0.20 per job ($2 per code job), $3 a day, 3 jobs per run.
# Public output: job counts, status codes and cost only.
# DeepSeek backup: switched OFF. To switch on later: add the secret DEEPSEEK_API_KEY and set JOB_DEEPSEEK_FALLBACK to "true".
on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: job-runner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (a failure stops the run)
        run: |
          python3 -W ignore scripts/job_runner/test_runner.py
          python3 -W ignore scripts/job_runner/test_code_role.py
      - name: Run pending jobs (private repo, never here)
        env:
          GENIE_LOGS_TOKEN: ${{ secrets.GENIE_LOGS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          JOB_DEEPSEEK_FALLBACK: "false"
          DAILY_COST_CAP: "3.00"
          DEFAULT_JOB_COST_CAP: "0.20"
          CODE_JOB_COST_CAP: "2.00"
          MAX_JOBS_PER_RUN: "3"
        run: |
          echo "::add-mask::$GENIE_LOGS_TOKEN"
          python3 scripts/job_runner/runner.py 2>/dev/null
