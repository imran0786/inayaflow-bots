name: Backlink batch (list builder + outreach, every hour)

# A. fixes the status flags in data/directories_candidates.json (and in the DeepSeek list builder's data/directories_candidates_deepseek.json, each row in its own file) from the directory agent's real results
# B. list builder: checks NEW directories on their live pages (GET only) and adds them; free (or free queue) +
#    relevant ones get usable=true, followed or nofollow (Imran 20 Nov 2026; the directory agent applies to those)
# C. outreach: at most 15 e-mails a day (at most 2 per run, hourly runs; rotates over the 17 target pages: homepage, 9 tools and 7 quick-win pages; quick wins count double), written as job files for the Namecheap outbox robot (never Gmail)
# Never signs up, never fills a form, never pays, never solves a CAPTCHA: those go to ops/blocked_needs_imran.md.
# Details: PRIVATE repo imran0786/genie, branch ops-reports. Public output: counts only.
# Runs EVERY HOUR (23 Nov 2026). The script skips a run when the last real run was under MIN_GAP_HOURS (0.5 h) ago.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = candidates may be written, NO e-mail is queued (drafts only)"
        default: "true"
      force:
        description: "true = run even if the last run was under 3 hours ago"
        default: "false"
      max_new_sites:
        description: "how many new directories to check"
        default: "40"
      max_ai_calls:
        description: "Haiku call cap for this run (about 1 per new site + 40 for outreach)"
        default: "80"

permissions:
  contents: write

concurrency:
  group: backlink-batch
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (a failure stops the run)
        run: |
          python3 -W ignore scripts/reports/test_reports.py
          python3 -W ignore scripts/reports/test_batch_qa.py
          python3 -W ignore scripts/reports/test_targets.py
          python3 -W ignore scripts/reports/test_hunter.py
          python3 -W ignore scripts/reports/test_merge.py
          python3 -W ignore scripts/reports/test_pushmerge.py
      - name: Run the batch
        env:
          GENIE_LOGS_TOKEN: ${{ secrets.GENIE_LOGS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || (github.event_name == 'schedule' && 'false') || 'true' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          MAX_NEW_SITES: ${{ github.event.inputs.max_new_sites || '40' }}
          MAX_AI_CALLS: ${{ github.event.inputs.max_ai_calls || '80' }}
          MAX_SENDS_PER_DAY: "15"
          MAX_SENDS_PER_RUN: "2"
          MIN_GAP_HOURS: "0.5"
        run: |
          echo "::add-mask::$GENIE_LOGS_TOKEN"
          python3 scripts/reports/backlink_batch.py 2>/dev/null
      - name: Save the candidates list (this repo, data file only)
        if: always()
        run: |
          git config user.name "inayaflow-bot"
          git config user.email "contact@inayaflow.ai"
          for f in data/directories_candidates.json data/directories_candidates_deepseek.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "data: directory candidates (backlink batch)"
          for i in 1 2 3; do
            if git push -q origin HEAD:main; then echo "saved"; exit 0; fi
            # conflict: keep our rows AND theirs (union by domain), never lose either side
            git show HEAD:data/directories_candidates.json > /tmp/ours.json
            git show HEAD:data/directories_candidates_deepseek.json > /tmp/ours_ds.json 2>/dev/null || true
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 scripts/reports/merge_candidates.py /tmp/ours.json data/directories_candidates.json
            if [ -s /tmp/ours_ds.json ] && [ -f data/directories_candidates_deepseek.json ]; then python3 scripts/reports/merge_candidates.py /tmp/ours_ds.json data/directories_candidates_deepseek.json; fi
            for f in data/directories_candidates.json data/directories_candidates_deepseek.json; do if [ -f "$f" ]; then git add "$f"; fi; done
            git diff --cached --quiet && { echo "nothing left to save"; exit 0; }
            git commit -q -m "data: directory candidates (backlink batch, merged)"
          done
          echo "push failed"; exit 1
