name: Heartbeat (keeps the robots running)

# GitHub's own cron is best effort and skipped every run from ~22:35 to 00:39 UTC
# on 18-19 Nov 2026. This job runs inside GitHub (no PC needed), nudges the inbox
# robots every 10 minutes, starts the daily robots if their schedule was skipped,
# and restarts itself before the 6-hour job limit. Imran 19 Nov: "It should be on
# automation, full stop."
#
# 25 Nov 2026 FIX (root cause, from the run logs of 23, 24 and 25 Nov): the job died every time GitHub answered ONE dispatch call with
# "HTTP 500: Failed to run workflow dispatch". The step ran with bash -e and the nudge() helper returned that failure, so a single
# transient 500 ended the whole 5h40m loop (exit code 1, red run) and the restart line at the end never ran. Now: no -e (shell: bash {0}),
# every nudge is retried once and a failure is only printed, and the restart is its own step with "if: always()" and retries, so the loop
# can no longer die silently. The "cancelled" scheduled runs seen every day are harmless: the concurrency group keeps ONE pending
# run and a newer pending run cancels the older one while the long job runs.
on:
  workflow_dispatch:
  schedule:
    - cron: "11 */3 * * *"   # backup: restarts the heartbeat if a chain ever breaks

permissions:
  actions: write
  contents: read

concurrency:
  group: heartbeat
  cancel-in-progress: false

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Nudge robots every 10 minutes for ~5h40m
        shell: bash {0}     # NOT bash -e: one failed API call must never end the loop
        run: |
          echo "LOOP_START=$(date +%s)" >> "$GITHUB_ENV"
          busy() { gh run list --repo "$REPO" --workflow "$1" --limit 5 --json status --jq '[.[]|select(.status=="in_progress" or .status=="queued")]|length'; }
          ran_today() { gh run list --repo "$REPO" --workflow "$1" --limit 20 --json createdAt,event --jq "[.[]|select(.createdAt|startswith(\"$(date -u +%F)\"))]|length"; }
          nudge() { if [ "$(busy "$1")" = "0" ]; then gh workflow run "$1" --repo "$REPO" --ref main "${@:2}" >/dev/null 2>&1 || { sleep 5; gh workflow run "$1" --repo "$REPO" --ref main "${@:2}" >/dev/null 2>&1; } && echo "$(date -u +%H:%M) started $1" || echo "$(date -u +%H:%M) could not start $1 (GitHub API error, will try again in 10 min)"; else echo "$(date -u +%H:%M) $1 already running"; fi; }
          age_min() { last=$(gh run list --repo "$REPO" --workflow "$1" --limit 1 --json createdAt --jq '.[0].createdAt // empty'); if [ -z "$last" ]; then echo 99999; else echo $(( ($(date -u +%s) - $(date -u -d "$last" +%s)) / 60 )); fi; }
          ran_since_uk() { since=$(date -u -d "TZ=\"Europe/London\" today $2" +%Y-%m-%dT%H:%M:%SZ); gh run list --repo "$REPO" --workflow "$1" --limit 10 --json createdAt --jq "[.[]|select(.createdAt >= \"$since\")]|length"; }
          end=$((SECONDS+20400))
          n=0
          while [ $SECONDS -lt $end ]; do
            nudge email-replier.yml
            nudge mail-router.yml
            nudge outbox.yml
            nudge reader.yml
            nudge job-runner.yml
            if [ $((n % 6)) = 0 ]; then nudge inbox-digest.yml; fi
            h=$(date -u +%H%M)
            # directory verify sweeper (24 Nov 2026): its own cron (13,43 * * * *) is best effort and was 62+ min late; start it when the last run is 40+ min old
            # nudge() itself never starts a run while one is queued or in progress (busy check); an unreadable age counts as "start once"
            va=$(age_min directory-verify.yml); case "$va" in ''|*[!0-9]*) va=99999;; esac
            if [ "$va" -ge 40 ]; then nudge directory-verify.yml -f dry_run=false; fi
            if [ "$h" -ge 0700 ] && [ "$(ran_today directory-agent.yml)" = "0" ]; then nudge directory-agent.yml -f dry_run=false; fi
            if [ "$h" -ge 0815 ] && [ "$(ran_today link-checker.yml)" = "0" ]; then nudge link-checker.yml; fi
            # report robots (19 Nov): inbox + backlinks report every 3 h; funnel numbers 07:30 UK; backlink batch 13:07 and 18:07 UK
            uk=$(TZ=Europe/London date +%H%M)
            if [ "$(age_min ops-report.yml)" -ge 175 ]; then nudge ops-report.yml; fi
            if [ "$uk" -ge 0730 ] && [ "$(ran_since_uk funnel-daily.yml 00:00)" = "0" ]; then nudge funnel-daily.yml; fi
            if [ "$uk" -ge 1307 ] && [ "$uk" -lt 1800 ] && [ "$(ran_since_uk backlink-batch.yml 13:00)" = "0" ]; then nudge backlink-batch.yml -f dry_run=false; fi
            if [ "$uk" -ge 1807 ] && [ "$(ran_since_uk backlink-batch.yml 18:00)" = "0" ]; then nudge backlink-batch.yml -f dry_run=false; fi
            n=$((n+1))
            sleep 600
          done
          echo "loop ended normally"
      - name: Restart the heartbeat (always, even when the loop above failed)
        if: always()
        shell: bash {0}
        run: |
          # a loop that died within ~10 minutes must NOT restart itself (tight failure cycle): leave it to keep-alive (3-hour slot)
          if [ $(( $(date +%s) - ${LOOP_START:-$(date +%s)} )) -lt 600 ]; then echo "loop ran under 10 minutes: not restarting, keep-alive will"; exit 0; fi
          for i in 1 2 3 4 5 6; do
            if gh workflow run heartbeat.yml --repo "$REPO" --ref main; then echo "restarted heartbeat"; exit 0; fi
            echo "restart attempt $i failed, waiting"; sleep 30
          done
          echo "could not restart the heartbeat; keepalive-check restarts it at its next 3-hour slot"
          exit 0
