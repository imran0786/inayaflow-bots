name: Directory agent (browser-use, daily engine)

# THE daily directory engine since 18 Nov (replaces the Playwright bot's schedule).
# Public repo: stdout = site names, result codes, counts and cost only (no URLs, e-mails, codes, passwords).
# State + logs live in the PRIVATE repo (imran0786/genie, branch ops-directory-logs, ops/directory_agent_*.md/json).
# Daily: runs every 3 hours (23 Nov 2026); caps are per UTC DAY, shared by all runs: 30 confirmed successes, 150 site attempts, 200 tool attempts; each run stops itself after 8400 s (140 min) and a 150-minute step timeout sits above that.
# Per-tool listings (data/listings.json): after a site's main listing, each free tool is submitted as its OWN product (up to 200 tool attempts a day). Never retries a finished site (see agent.py eligible()).
# Primary model Haiku 5.5, Sonnet 5.5 as fallback when Haiku ends OTHER/ERROR/TIMEOUT.
# SPEND: this robot's hard cap is $7.10 a UTC day. $14.98 a day is the hard cap of the LISTED robots together (directory 7.10, hunter 3.00, list builder 1.00, platform poster 0.90, batch 1.00, report 0.48,
# replier 0.45, router 0.45, DEV poster 0.60); the job runner's other helper jobs have their own separate $15/day cap on top (see README).
on:
  schedule:
    - cron: "37 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = stop right before the final submit (state is not updated)"
        default: "true"
      allow_signup:
        description: "true = the agent may create an account with contact@ (approved directory sign-up exception)"
        default: "true"
      model:
        description: "primary model"
        default: "claude-haiku-5-5"
      fallback_model:
        description: "fallback model (empty = none)"
        default: "claude-sonnet-5-5"
      only:
        description: "optional: comma-separated site names (batch mode only)"
        default: ""
      batch_file:
        description: "empty = daily feed; or a batch json path in the repo (manual test, ignores caps and state)"
        default: ""

permissions:
  contents: read

concurrency:
  group: directory-agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore state and logs from the private repo
        env:
          GENIE_LOGS_TOKEN: ${{ secrets.GENIE_LOGS_TOKEN }}
        run: |
          echo "::add-mask::$GENIE_LOGS_TOKEN"
          mkdir -p ops
          if git clone -q --branch ops-directory-logs --depth 1 "https://x-access-token:${GENIE_LOGS_TOKEN}@github.com/imran0786/genie.git" /tmp/logs 2>/dev/null; then
            for f in directory_agent_log.md directory_agent_state.json directory_agent_summary.md directory_agent_spend.json directory_state.json directory_verify_state.json; do
              cp "/tmp/logs/ops/$f" "ops/$f" 2>/dev/null || true
            done
            echo "state restored"
          else
            echo "no logs branch yet"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests (offline)
        run: python3 -W ignore scripts/directory_agent/test_agent.py

      - name: Install browser-use (pinned)
        run: python3 -m pip install -q 'browser-use==1.0.6' 2>&1 | tail -2

      - name: Check that the token limits can be installed (a failure stops the run before any spend)
        run: python3 -c "import sys; sys.path.insert(0, 'scripts/directory_agent'); import agent; sys.exit(0 if agent.preflight_limits() else 1)" 2>/dev/null

      - name: Run agent
        timeout-minutes: 150   # shorter than the job (180), so the save step below always has time to run, even after a timeout
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONTACT_EMAIL_PASSWORD: ${{ secrets.CONTACT_EMAIL_PASSWORD }}
          DIR_MASTER_KEY: ${{ secrets.DIR_MASTER_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || (github.event_name == 'schedule' && 'false') || 'true' }}
          ALLOW_SIGNUP: ${{ github.event.inputs.allow_signup || 'true' }}
          AGENT_MODEL: ${{ github.event.inputs.model || 'claude-haiku-5-5' }}
          FALLBACK_MODEL: ${{ (github.event_name == 'schedule' && 'claude-sonnet-5-5') || github.event.inputs.fallback_model }}
          ONLY: ${{ github.event.inputs.only || '' }}
          BATCH_FILE: ${{ github.event.inputs.batch_file || '' }}
          DAILY_SUCCESS_CAP: "30"
          DAILY_ATTEMPT_CAP: "150"
          DAILY_TOOL_ATTEMPT_CAP: "200"
          DAILY_USD_CAP: "7.10"   # 24 Nov late: +2.00 from list builder (277 sites queued). Earlier 24 Nov (was 6; $0.90 moved to platform-poster). 23 Nov: hunter stops at $6 a day; no attempt starts unless spent + ATTEMPT_MAX_USD fits under this
          ATTEMPT_MAX_USD: "1.00"
          UNPRICED_ATTEMPT_USD: "1.00"
          RUN_BUDGET_PRIMARY_USD: "0.15"
          RUN_BUDGET_FALLBACK_USD: "0.20"
          RUN_SECONDS: "8400"   # 140 min: the agent stops itself below the 150-minute step timeout
          BROWSER_USE_SETUP_LOGGING: "false"
          ANONYMIZED_TELEMETRY: "false"
        run: python3 scripts/directory_agent/agent.py 2>/dev/null

      - name: Save state and logs to the private repo (never here)
        if: always()
        env:
          GENIE_LOGS_TOKEN: ${{ secrets.GENIE_LOGS_TOKEN }}
        run: |
          echo "::add-mask::$GENIE_LOGS_TOKEN"
          set -e
          rm -rf /tmp/push
          if git clone -q --branch ops-directory-logs --depth 1 "https://x-access-token:${GENIE_LOGS_TOKEN}@github.com/imran0786/genie.git" /tmp/push 2>/dev/null; then
            :
          else
            git clone -q --depth 1 "https://x-access-token:${GENIE_LOGS_TOKEN}@github.com/imran0786/genie.git" /tmp/push
            cd /tmp/push && git checkout -q --orphan ops-directory-logs && git rm -rq --cached . >/dev/null 2>&1 || true
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} + ; cd - >/dev/null
          fi
          mkdir -p /tmp/push/ops
          for f in directory_agent_log.md directory_agent_state.json directory_agent_summary.md directory_agent_spend.json; do
            [ -f "ops/$f" ] && cp "ops/$f" "/tmp/push/ops/$f" || true
          done
          cd /tmp/push
          git config user.name "inayaflow-bot"
          git config user.email "contact@inayaflow.ai"
          git add ops
          if git diff --cached --quiet; then echo "no log changes"; exit 0; fi
          git commit -q -m "ops: directory agent state and log"
          git pull -q --rebase origin ops-directory-logs 2>/dev/null || true
          git push -q origin ops-directory-logs
          echo "state and log saved"
